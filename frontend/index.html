<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Never Silent · English to ASL</title>
  <meta name="description" content="Type an English sentence and watch it signed in American Sign Language.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Never Silent</h1>
      <p class="tagline">Because everyone deserves to be understood.</p>
    </header>

    <section class="stage" aria-label="Signing figure">
      <div class="figure-wrap">
        <canvas id="figure" role="img" aria-label="A signing figure. Loading."></canvas>
        <div class="controls" role="group" aria-label="Playback">
          <button type="button" id="play" class="ctl" aria-label="Pause">
            <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>
            <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L5.9 2.7a.6.6 0 0 0-.9.5z"/></svg>
          </button>
          <div class="speed" role="group" aria-label="Speed">
            <button type="button" class="ctl ctl-text" data-speed="0.5" aria-pressed="false">0.5×</button>
            <button type="button" class="ctl ctl-text" data-speed="1" aria-pressed="true">1×</button>
          </div>
          <button type="button" id="loop" class="ctl" aria-pressed="true" aria-label="Loop">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5V7a3 3 0 0 1 3-3h6.5"/><path d="M10.5 2l2 2-2 2"/><path d="M13 8.5V9a3 3 0 0 1-3 3H3.5"/><path d="M5.5 14l-2-2 2-2"/></svg>
          </button>
        </div>
      </div>

      <div class="subtitles">
        <ol id="gloss" class="gloss" aria-label="ASL gloss"></ol>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <form id="form" class="ask" autocomplete="off">
      <label for="text" class="ask-label">Type an English sentence</label>
      <div class="ask-row">
        <input id="text" name="text" type="text" maxlength="300" placeholder="Type a sentence…" required>
        <button id="submit" type="submit" class="btn">Sign it</button>
      </div>
      <div class="examples" aria-label="Examples">
        <button type="button" class="example">Hello, how are you?</button>
        <button type="button" class="example">I hope we can trust the agreement.</button>
        <button type="button" class="example">Thank you for your help.</button>
      </div>
    </form>

    <footer class="footer">
      <p>NLP 434 · Princess Nora bint Abdulrahman University · Natali Shaat, Ghaida Alharbi, Lena Aldokhayel, Alhanouf Alsaiary</p>
      <p><a href="https://github.com/SignBridgeApp" target="_blank" rel="noopener">Sign clips from SignBridge (MIT licence)</a></p>
    </footer>
  </main>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
